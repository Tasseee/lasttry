name: Build Nightfall Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightfall-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fabric mod (Minecraft 1.21.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The project currently has no Gradle Wrapper, so install Gradle directly.
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Build Nightfall
        run: gradle --no-daemon --stacktrace clean build

      - name: Verify release JAR exists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_jars=(build/libs/*.jar)
          found=false
          for jar in "${release_jars[@]}"; do
            case "$jar" in
              *-dev.jar|*-sources.jar) continue ;;
            esac
            echo "Release JAR: $jar"
            found=true
          done
          if [[ "$found" != true ]]; then
            echo "No release JAR found in build/libs/." >&2
            exit 1
          fi

      - name: Upload Nightfall mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: Nightfall-Client-Minecraft-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
